  <style>
    .ureed-splash {
      position: absolute;
      top: calc(50% - 32px);
      right: calc(50% - 32px);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 64px;
      height: 64px;
    }

    .ureed-splash div {
      position: absolute;
      top: 27px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #006df5;
      animation-timing-function: cubic-bezier(0, 1, 1, 0);
    }

    .ureed-splash div:nth-child(1) {
      left: 6px;
      animation: ureed-splash1 0.6s infinite;
    }

    .ureed-splash div:nth-child(2) {
      left: 6px;
      animation: ureed-splash2 0.6s infinite;
    }

    .ureed-splash div:nth-child(3) {
      left: 26px;
      animation: ureed-splash2 0.6s infinite;
    }

    .ureed-splash div:nth-child(4) {
      left: 45px;
      animation: ureed-splash3 0.6s infinite;
    }

    @keyframes ureed-splash1 {
      0% {
        transform: scale(0);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes ureed-splash3 {
      0% {
        transform: scale(1);
      }

      100% {
        transform: scale(0);
      }
    }

    @keyframes ureed-splash2 {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(19px, 0);
      }
    }
  </style>
