    <script>
      // Pre-React Arabic patch for the evidence uploader.
      // Runs before the app bundle so it never depends on React/i18n timing
      // or on a stale PWA bundle. Scoped to Arabic users only.
      (function () {
        try {
          var isArabic = function () {
            // ONLY trust live i18n state. Never look at the cached
            // profile.preferred_language — it can be stale and force English
            // pages into Arabic when the user has switched the UI to English.
            try {
              var ls = window.localStorage && window.localStorage.getItem("i18nextLng");
              if (ls) return ls.toLowerCase().indexOf("ar") === 0;
            } catch (e) {}
            var lang = (document.documentElement.lang || "").toLowerCase();
            if (lang) return lang.indexOf("ar") === 0;
            if (document.documentElement.dir === "rtl") return true;
            return false;
          };
          var REPLACEMENTS = [
            [/Evidence Attachments \(Optional\)/g, "المرفقات الداعمة (اختياري)"],
            [/Upload screenshots, documents, or any relevant proof\.\s*Max\s*\d+\s*files,\s*\d+\s*MB each\.?/g, "ارفع لقطات الشاشة أو المستندات أو أي دليل ذي صلة. الحد الأقصى 5 ملفات، 10 ميجابايت لكل ملف."],
            [/Click to upload or drag and drop/g, "اضغط للرفع أو اسحب وأفلت الملفات"],
            [/Images, PDFs, Word documents/g, "صور، ملفات PDF، مستندات Word"]
          ];
          var patchText = function (node) {
            var v = node.nodeValue;
            if (!v) return;
            var next = v;
            for (var i = 0; i < REPLACEMENTS.length; i++) {
              next = next.replace(REPLACEMENTS[i][0], REPLACEMENTS[i][1]);
            }
            if (next !== v) node.nodeValue = next;
          };
          var walk = function (root) {
            try {
              var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
              var n = w.nextNode();
              while (n) { patchText(n); n = w.nextNode(); }
            } catch (e) {}
          };
          var apply = function () { if (isArabic() && document.body) walk(document.body); };
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", apply, { once: true });
          } else {
            apply();
          }
          try {
            var obs = new MutationObserver(function (muts) {
              if (!isArabic()) return;
              for (var i = 0; i < muts.length; i++) {
                var m = muts[i];
                m.addedNodes && m.addedNodes.forEach(function (node) {
                  if (node.nodeType === 3) patchText(node);
                  else if (node.nodeType === 1) walk(node);
                });
                if (m.type === "characterData" && m.target && m.target.nodeType === 3) patchText(m.target);
              }
            });
            obs.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
          } catch (e) {}
        } catch (e) {}
      })();
    </script>
